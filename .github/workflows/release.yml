# Push tag vX.Y.Z to release compose-script X.Y.Z: builds it with the newest fast-compose release on Maven Central,
# publishes it to npm, which jsDelivr serves at
# https://cdn.jsdelivr.net/npm/@fast-compose/compose-script@X.Y.Z/compose-script.js
# then creates a GitHub release and points the README's script URL at X.Y.Z.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Find the newest fast-compose release
        run: |
          metadata=https://repo1.maven.org/maven2/io/github/fast-compose/fast-compose/maven-metadata.xml
          engine=$(curl -sf $metadata | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          test -n "$engine"
          echo "ENGINE=$engine" >> $GITHUB_ENV
          echo "fast-compose $engine"

      # COMPOSE_SCRIPT_VERSION makes the script load its .wasm files from this exact version (webpack.config.d).
      - name: Build
        run: |
          chmod +x gradlew
          COMPOSE_SCRIPT_VERSION=${VERSION#v} ./gradlew wasmJsBrowserDistribution \
            -PfastComposeVersion=$ENGINE --no-build-cache

      # The npm README gets this version in its script URL, and its logo from the tagged source on GitHub.
      - name: Package
        run: |
          out=build/dist/wasmJs/productionExecutable
          mkdir -p dist
          cp $out/*.js $out/*.js.LICENSE.txt $out/*.wasm dist/
          cp README.md LICENSE dist/
          sed -E -i \
            -e "s#(@fast-compose/compose-script)(@[^/\"]*)?/compose-script\.js#\1@${VERSION#v}/compose-script.js#g" \
            -e "s#src=\"docs/#src=\"https://raw.githubusercontent.com/fast-compose/compose-script/$VERSION/docs/#g" \
            dist/README.md
          cat > dist/package.json <<JSON
          {
            "name": "@fast-compose/compose-script",
            "version": "${VERSION#v}",
            "description": "Live Compose inside static HTML pages, built with Fast Compose ${ENGINE}",
            "keywords": ["compose", "jetpack-compose", "kotlin", "wasm", "preview"],
            "homepage": "https://github.com/fast-compose/compose-script",
            "license": "Apache-2.0",
            "repository": { "type": "git", "url": "git+https://github.com/fast-compose/compose-script.git" },
            "main": "compose-script.js"
          }
          JSON
          ls -la dist

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing: npm checks this workflow's identity, so no token is stored. It needs npm 11.5.1 or newer.
      - name: Publish to npm
        working-directory: dist
        run: |
          npm install -g npm@latest
          npm publish --access public

      # Titled with the bare version, so v0.1.4 is released as 0.1.4.
      - name: Name the release
        run: echo "RELEASE_NAME=${VERSION#v}" >> $GITHUB_ENV

      # Only GitHub's source archives are attached.
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true

      - name: Use this version in the README on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -E -i "s#(@fast-compose/compose-script)(@[^/\"]*)?/compose-script\.js#\1@${VERSION#v}/compose-script.js#g" \
            README.md
          if git diff --quiet; then echo "README already uses ${VERSION#v}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: use ${VERSION#v} in README"
          git push origin main
